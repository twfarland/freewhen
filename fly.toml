app = "freewhen"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Rooms are written here so a deploy does not destroy them. Remove this and
  # the mount below to run with nothing on disk; every release then costs every
  # room in progress. See docs/adr/0011.
  FW_SNAPSHOT_FILE = "/data/freewhen.dets"
  # Set this to the deployed origin before going public. Unset, every origin is
  # accepted, which is a development default and not a policy.
  # FW_ALLOWED_ORIGINS = "https://freewhen.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true

  # Rooms live in RAM on one machine. Stopping it discards every room in
  # progress, so the machine stays up even when idle, and there is exactly one
  # of it: a second machine would answer for hashes it has never heard of.
  # Scaling out means routing by hash with fly-replay first — see
  # docs/OPERATIONS.md.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

# One volume, one machine. The volume is pinned to a host: it survives deploys
# and restarts, not the loss of that host, which is the ceiling on durability.
[mounts]
  source = "freewhen_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
