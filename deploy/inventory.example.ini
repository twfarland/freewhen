; Copy to inventory.ini (gitignored — it names a real machine) and fill in.
; One host, because a room is a process and there is exactly one node that
; owns it.

[freewhen]
freewhen.example.com ansible_user=root

[freewhen:vars]
; The name Caddy gets a certificate for, and the only origin the websocket
; will accept once this is set.
domain=freewhen.example.com

; Ceiling on the node, not a target. Measured with bench/load.escript, the
; worst case at the configured caps is about 1.15 GB of room state.
memory_max=2G
